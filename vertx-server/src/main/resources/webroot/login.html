<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="/css/default-theme-motadata.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>IPAM Login</title>
</head>

<body class="login">

<span id="notification"></span>
<div class="login-main-panel">
    <div class="login-box-panel">
        <div class="login-title-main">
            <h1>IP Address Manager</h1>
        </div>
        <div class="login-middle-panel">
            <div class="logo-brand-login">
                <img src="/images/logo.png" alt="Motadata Logo">
            </div>
            <div id="loginContainer">
                <form name="sentMessage" action="javascript:void(0);" method="post" id="loginForm">
                    <div class="login-header">Sign In</div>
                    <div class="msg error-msg" id="loginErrorMsg" style="color: red; margin-bottom: 10px;"></div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <label>Username</label>
                            <input type="text" class="form-control" placeholder="User name" id="userName" name="userName" required validationMessage="User Name is required">
                            <p class="help-block text-danger"></p>
                        </div>
                    </div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <label>Password</label>
                            <input type="password" class="form-control" placeholder="Password" id="password" name="password" required validationMessage="Password is required">
                            <p class="help-block text-danger"></p>
                            <i class="fa fa-eye" id="showPassword" style="cursor: pointer;"></i>
                        </div>
                    </div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <a class="forgot-password" id="forgetPassword">Forgot Password?</a>
                        </div>
                    </div>
                    <div id="success"></div>
                    <div class="row">
                        <div class="form-group col-xs-6 reminder-me">
                            <input type="checkbox" id="remember" name="remember" class="k-checkbox" checked>
                            <label class="k-checkbox-label" for="remember">Remember me</label>
                        </div>
                        <div class="form-group col-xs-6 align-right margin-t-10">
                            <button type="submit" id="loginFormSubmitBtn" class="k-button k-button-icontext k-primary k-grid-update float-r margin-0" style="margin: 0">Sign In</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="login-footer-copy">
            <b>Powered by Motadata</b>
        </div>
    </div>
</div>

<script type="text/javascript" src="/js/plugins/jquery-2.1.1.min.js"></script>
<script type="text/javascript" src="/js/plugins/kendo.all.min.js"></script>
<script type="text/javascript" src="/js/materialPreloader.js"></script>
<script type="text/javascript" src="/js/SmartNotification.min.js"></script>
<script type="text/javascript" src="/js/loader.js"></script>

<script type="text/javascript" src="/js/motadata/login.js"></script>
<script type="text/javascript" src="/js/motadata/flux.js"></script>
<script type="text/javascript" src="/js/motadata/app.js"></script>
<script type="text/javascript" src="/js/motadata/navigation.js"></script>
<script type="text/javascript" src="/js/motadata/form.js"></script>
<script type="text/javascript" src="/js/motadata/notification.js"></script>

<script type="text/javascript">
    $(document).ready(function ()
    {
        if (appManager.getCookie("token")) {
            window.location.replace("/home.html");
            return;
        }

        login.init();

        $("#loginForm").on("submit", function (e) {
            e.preventDefault();
            $("#loginErrorMsg").text("");
            var username = $("#userName").val();
            var password = $("#password").val();

            if (!username || !password) return;

            $.ajax({
                url: "/api/auth/login",
                type: "POST",
                contentType: "application/json",
                dataType: "json",
                data: JSON.stringify({ username: username, password: password }),
                success: function (res) {
                    if (res && res.success && res.data) {
                        var token = res.data.token || res.data.access_token;
                        var uname = res.data.user ? res.data.user.username : username;
                        var perms = (res.data.user && res.data.user.permissions && res.data.user.permissions.length > 0) ? res.data.user.permissions : [
                            "ROLE_ADMIN", "ALL", "PERM_ALL",
                            "PERM_DASHBOARD_READ", "PERM_DASHBOARD_WRITE",
                            "PERM_SUBNET_VIEW", "PERM_SUBNET_EDIT", "PERM_SUBNET_DELETE",
                            "PERM_DISCOVERY_READ", "PERM_DISCOVERY_WRITE",
                            "PERM_DHCP_READ", "PERM_DHCP_WRITE",
                            "PERM_ALERTS_READ", "PERM_ALERTS_WRITE", "PERM_ALERT_READ", "PERM_ALERT_WRITE",
                            "PERM_SETTINGS_READ", "PERM_SETTINGS_WRITE",
                            "PERM_EVENT NOTIFICATIONS_READ", "PERM_EVENT NOTIFICATIONS_WRITE", "PERM_EVENT_NOTIFICATIONS_READ", "PERM_EVENT_NOTIFICATIONS_WRITE",
                            "PERM_REPORTS_READ", "PERM_REPORTS_WRITE",
                            "PERM_ROGUE DETECTION_READ", "PERM_ROGUE DETECTION_WRITE", "PERM_ROGUE_DETECTION_READ", "PERM_ROGUE_DETECTION_WRITE",
                            "PERM_IP REQUESTS_READ", "PERM_IP REQUESTS_WRITE", "PERM_IP_REQUESTS_READ", "PERM_IP_REQUESTS_WRITE"
                        ];
                        
                        document.cookie = "token=" + token + "; Path=/; max-age=86400; SameSite=Lax";
                        document.cookie = "userName=" + uname + "; Path=/; max-age=86400; SameSite=Lax";
                        document.cookie = "authorities=" + encodeURIComponent(JSON.stringify(perms)) + "; Path=/; max-age=86400; SameSite=Lax";
                        
                        login.setLocalStorage();
                        window.location.href = "/home.html";
                    } else {
                        $("#loginErrorMsg").text((res && res.message) || "Invalid username or password");
                    }
                },
                error: function (xhr) {
                    var err = "Invalid username or password";
                    try {
                        var json = JSON.parse(xhr.responseText);
                        if (json.message) err = json.message;
                    } catch (ex) {}
                    $("#loginErrorMsg").text(err);
                }
            });
        });
    });
</script>
</body>
</html>
